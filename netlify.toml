[build]
  command = "python3 scripts/sync-project-authors.py --check && hugo --gc --minify --buildFuture -b $URL"
  publish = "public"
  # sync-project-authors.py --check runs first and fails the build if a project
  # page is missing a lab member who appears on one of its publications. The same
  # check guards scripts/deploy-manual.sh; it is repeated here because a Netlify
  # build never runs that script, and would otherwise publish the drift.
  #
  # Whether a commit deploys is decided by scripts/netlify-ignore.sh, driven by
  # the DEPLOY_POLICY environment variable set in the Netlify UI. Default
  # (unset) is "manual": nothing deploys unless the commit message says
  # [deploy]. Set DEPLOY_POLICY=auto once the credit budget allows.
  # DEPLOY_POLICY is intentionally not declared in this file, so the policy can
  # be changed from the UI without a commit.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  HUGO_VERSION = "0.89.2"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "python3 scripts/sync-project-authors.py --check && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "python3 scripts/sync-project-authors.py --check && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

[[redirects]]
  from = "/weibel"
  to = "/author/nadir-weibel/"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/weibel/cv"
  to = "/author/nadir-weibel/CV_NadirWeibel.pdf"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/publications"
  to = "/publication"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/join"
  to = "https://forms.gle/w7WswQadg2s79wbU8"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/deploy"
  to = "https://app.netlify.com/sites/hxi-ucsd/deploys"
  status = 200
  force = true # COMMENT: ensure that we always redirect
  
[[redirects]]
  from = "/course/cse218/enroll"
  to = "https://forms.gle/eGcyWzXZqX2AmZRA6"
  status = 200
  force = true # COMMENT: ensure that we always redirect

# Old project and author URLs are declared as `aliases:` in each page's front
# matter. Wowchemy's `redirects` output format compiles them into public/_redirects
# at build time, so they move with the page if a folder is ever renamed again.
