# Configuration of Hugo
# Guide: https://wowchemy.com/docs/getting-started/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: HXI - Human-centered eXtended Intelligence # Website name
baseurl: '' # Website URL
copyright: 'HXI@UCSD © {year}' # Footer text, e.g. '© {year} Me'

# Publish pages dated in the future. Accepted-but-not-yet-presented papers are
# dated at their conference date, which is often months ahead.
buildFuture: true

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## MODULES
############################

module:
  imports:
    - path: github.com/wowchemy/wowchemy-hugo-modules/wowchemy-cms
    - path: github.com/wowchemy/wowchemy-hugo-modules/wowchemy
    #- path: github.com/nadirweibel/wowchemy-widget-allpages

  hugoVersion:
    min: '0.84.1'
    extended: true

############################
## ADVANCED
############################

enableGitInfo: true
summaryLength: 30
paginate: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  authors: '/author/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
disableAliases: false
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects, bibtex]
  section: [HTML, RSS]
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart
timeout: 600000
# Combined BibTeX export of all publications, generated at build time from each
# publication's own cite.bib (layouts/publication/list.bib). Served at
# /hxi.bib (layouts/index.bib).
outputFormats:
  bibtex:
    mediaType: application/x-bibtex
    baseName: hxi
    isPlainText: true
    notAlternative: true

mediaTypes:
  application/x-bibtex:
    suffixes:
      - bib

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
# "Related" content. Publication tags here are overwhelmingly venue acronyms and
# years (median tags per publication: 0), so weighting tags highly made "related"
# mean "same conference or same year", which read as random. `categories` carries
# the project slugs (mirrored from `projects:`), which is the real signal.
# Note: `projects` itself cannot be used as an index. params.yaml defines a
# site-level `projects` map, so Hugo's param lookup returns that map for any page
# lacking the field and the build fails with "indexing currently not supported".
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: categories
      weight: 100
    - name: tags
      weight: 25


